plugins { id 'com.android.application' }
android {
    namespace 'app.snakesponja'
    compileSdk 35
    defaultConfig {
        applicationId 'app.snakesponja'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('BUILD_NUMBER') ?: '1')
        versionName '1.0.' + (System.getenv('BUILD_NUMBER') ?: '1')
    }
}
