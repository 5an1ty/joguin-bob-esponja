name: APK Android
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reutilizar assinatura de desenvolvimento
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: snake-android-debug-signing-v1
      - run: bash android/prepare-assets.sh
      - name: Compilar APK instalável de teste
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Nomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk bob-esponja-snake.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bob-esponja-snake-apk
          path: bob-esponja-snake.apk
      - name: Publicar download
        env:
          GH_TOKEN: ${{ github.token }}
          APK_TAG: android-${{ github.run_number }}
        run: gh release create "$APK_TAG" bob-esponja-snake.apk --target "$GITHUB_SHA" --title "Android $APK_TAG" --notes "APK experimental Android 8 ou superior. Inclui jogo, imagens e músicas offline. Assinatura de desenvolvimento; não é uma versão da Play Store."
